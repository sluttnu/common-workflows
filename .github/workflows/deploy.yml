name: deploy

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      allowed_apps:
        required: true
        type: string

jobs:
  deploy:
    runs-on: sluttvps-deploy
    env:
      APP: ${{ inputs.app }}
      ALLOWED_APPS: ${{ inputs.allowed_apps }}

    steps:
      - name: Validate app
        shell: bash
        run: |
          IFS=',' read -ra APPS <<< "$ALLOWED_APPS"
          for allowed in "${APPS[@]}"; do
            if [ "$APP" = "$allowed" ]; then
              ok=1
              break
            fi
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "unknown app: $APP"
            exit 1
          fi
          test -f "/opt/stack/$APP/compose.yaml"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart
        working-directory: /opt/stack/${{ env.APP }}
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps
