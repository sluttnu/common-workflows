name: deploy

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

jobs:
  deploy:
    runs-on: sluttvps-deploy
    env:
      APP: ${{ inputs.app }}

    steps:
      - name: Validate app
        run: |
          case "$APP" in
            slutt-web|gjesteparkering) ;;
            *) echo "unknown app: $APP"; exit 1 ;;
          esac
          test -f "/opt/stack/$APP/compose.yaml"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and restart
        working-directory: /opt/stack/${{ env.APP }}
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps
